version: 1
last_updated: "2026-10-25"
scope: "建築書籤面板、士氣資訊預警及結算／跨階／崩潰呈現切片；非全專案需求覆蓋"
source: "使用者核准之建築面板與 PB-P0-014E 計畫；GDD 第 25、30 章"
requirements:
  - id: TR-BUI-001
    requirement: "四區佈局：左建築資訊、中功能書籤、右功能頁、最右當前製作列；非製作頁隱藏佇列並擴大功能區。"
  - id: TR-BUI-002
    requirement: "左側顯示名稱、狀態、等級、目前效果、下一級收益與需求，提供符合狀態的施工／升級／取消與進度。"
  - id: TR-BUI-003
    requirement: "公開未解鎖頁可預覽但不可操作；未公開頁完全隱藏；首次開啟選首個可用頁否則首個预覽頁，關閉重開重設，同次開啟保留各頁閱讀狀態。"
  - id: TR-BUI-004
    requirement: "每個互動獨立書籤；多製作列獨立產能與佇列；食譜點擊只展開一個，顯示產出、效果、成本、製造力及明確加入製作操作與不可用原因。"
  - id: TR-BUI-005
    requirement: "依實際順序顯示 Job 圖示或名稱、進度與狀態；左鍵以 JobId 定位並展開食譜及任務詳情；右鍵請求取消、標示待取消、不重送，既有結算才移除並解除保留。"
  - id: TR-BUI-006
    requirement: "頁面配置獨立於經濟結算，含穩定 ID、標題、順序、公開狀態和互動或資訊引用；未配置建築沿 Interactions 順序；資訊頁只明確註冊且提供 Bind/Refresh/Unbind；情報中心先顯示唯讀現有基地數值。"
  - id: TR-BUI-007
    requirement: "沿用 BuildingSystem 命令、施工及結算規則與流程鎖定，事件／探索不得繞過；更新不無條件重建所有頁面；Editor 工具可重複套用核准紙張和圖示且不重建整個 SampleScene。"
  - id: TR-BUI-008
    requirement: "涵蓋未建造／正常／升級／最高級、多列、重複食譜 Job、資源不足／滿列／空資料／缺圖／長文字／資訊可見性；1280x720 與 1920x1080，狀態不僅用顏色；只離線編譯與小範圍驗證，記錄證據。"
  - id: TR-MUI-001
    requirement: "常駐顯示目前士氣、不可逆 Stage 與三層金字塔；詳情顯示上限、永久損失、下一門檻、Profile 效果與恢復不回復階段說明；未就緒不得顯示為崩潰。"
  - id: TR-MUI-002
    requirement: "以目前已知狀態提供唯讀輪末預測，與實際結算共用計算且不修改狀態、揭露未抽卡、排程效果或消耗亂數；相同已知輸入且無新增未知結果時須與結算一致。"
  - id: TR-MUI-003
    requirement: "規則層計入永久上限損傷；有此風險時士氣區隱藏精確終值及總損傷量，保留跨階／崩潰警告；各殭屍詳情公開自身已知後果與生效時機。"
  - id: TR-MUI-004
    requirement: "完整交易後更新食物、資源、戰鬥與士氣分散預警；用口語短文字、圖示形狀和一次性短暫強調，危險解除撤除，不以顏色或特效單獨傳意。"
  - id: TR-MUI-005
    requirement: "僅結束本輪的死亡、跨階或永久損傷需要合併確認；返回不提交，確認重驗最新狀態；沿用 Failed、事件與探索鎖定，關閉輸入不可穿透。"
  - id: TR-MUI-006
    requirement: "Editor 套用冪等且保留手動排版，不重建場景；以針對性測試驗證數值與唯讀性，以雙解析度、灰階及小範圍 Play 驗證 UI，未驗證項目如實標記。"
  - id: TR-MUI-007
    requirement: "實際結算依其他資源、士氣計數、必要跨階呈現、崩潰或合法後續流程的順序交接；呈現期間維持操作鎖定，完成訊號只放行一次，缺少呈現元件時使用可控的即時完成路徑。"
  - id: TR-MUI-008
    requirement: "跨階呈現永久破損、實際舊效果移除、最終新效果加入與不可恢復摘要；一次跨兩階不得假裝中間效果曾生效；左鍵或 Space 可逐步略過且不穿透，減少動態效果保留相同結果與文字。"
  - id: TR-MUI-009
    requirement: "基地崩潰報告顯示交易前後士氣、上限、最後來源與主要原因；輪末、事件或卡牌造成的崩潰只失敗一次並停止事件、建築與下一輪，重新開始交由局前 Profile 選擇入口接管。"

